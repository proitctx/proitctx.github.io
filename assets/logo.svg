<svg xmlns="http://www.w3.org/2000/svg" width="320" height="64" viewBox="0 0 320 64" role="img" aria-labelledby="title desc">
  <title id="title">Pro IT of Central Texas</title>
  <desc id="desc">A technical wordmark drawn as a compact NVMe circuit board.</desc>

  <!-- M.2 board silhouette -->
  <path d="M9 6H314V23H304V41H314V58H9A5 5 0 0 1 4 53V11a5 5 0 0 1 5-5Z"
        fill="#e8e2d3" stroke="#161815" stroke-width="1.5"/>

  <!-- Mounting point -->
  <circle cx="19" cy="32" r="7.25" fill="none" stroke="#161815" stroke-width="1.25"/>
  <circle cx="19" cy="32" r="2.35" fill="#e35b32"/>

  <!-- Controller package -->
  <g>
    <rect x="36" y="14" width="43" height="36" rx="2" fill="#2e6a4a" stroke="#161815" stroke-width="1.25"/>
    <rect x="43" y="20" width="29" height="24" rx="1" fill="none" stroke="#e8e2d3" stroke-opacity=".52"/>
    <path d="M39 18h-5m5 7h-5m5 7h-5m5 7h-5m5 7h-5M76 18h6m-6 7h6m-6 7h6m-6 7h6m-6 7h6"
          stroke="#161815" stroke-width="1"/>
    <text x="57.5" y="35" text-anchor="middle" fill="#e8e2d3"
          font-family="monospace" font-size="7.5" font-weight="700" letter-spacing="1">PIT</text>
  </g>

  <!-- Printed traces -->
  <g fill="none" stroke-linecap="square">
    <path d="M82 20h10l5-5h38" stroke="#e35b32" stroke-width="1.4"/>
    <path d="M82 27h14l5-5h27" stroke="#2e6a4a" stroke-width="1"/>
    <path d="M82 39h11l5 5h38" stroke="#2e6a4a" stroke-width="1"/>
    <path d="M82 46h10l5 5h56" stroke="#e35b32" stroke-width="1.4"/>
    <circle cx="135" cy="15" r="1.8" fill="#e35b32" stroke="none"/>
    <circle cx="128" cy="22" r="1.4" fill="#2e6a4a" stroke="none"/>
    <circle cx="136" cy="44" r="1.4" fill="#2e6a4a" stroke="none"/>
    <circle cx="153" cy="51" r="1.8" fill="#e35b32" stroke="none"/>
  </g>

  <!-- Wordmark -->
  <g fill="#161815" font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="36" font-size="21" font-weight="800" letter-spacing="1">PRO</text>
    <text x="190" y="36" font-size="21" font-weight="800" letter-spacing="1">IT</text>
    <text x="98" y="47" fill="#66685f" font-family="monospace" font-size="7.2" font-weight="600" letter-spacing="1.15">OF CENTRAL TEXAS</text>
  </g>
  <g stroke="#e35b32" stroke-width="2.4">
    <path d="M176 20l-6 16"/>
    <path d="M183 20l-6 16"/>
  </g>

  <!-- Memory packages and part marks -->
  <g fill="none" stroke="#161815" stroke-width="1">
    <rect x="220" y="14" width="24" height="18" rx="1.5"/>
    <rect x="249" y="14" width="24" height="18" rx="1.5"/>
  </g>
  <g fill="#161815" font-family="monospace" font-size="4.8" letter-spacing=".5">
    <text x="223" y="24">M 01</text>
    <text x="252" y="24">M 02</text>
    <text x="220" y="44" fill="#2e6a4a" font-size="5.5">NVME / CTX</text>
  </g>
  <path d="M220 48h53" stroke="#161815" stroke-opacity=".28" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Keyed edge connector -->
  <g fill="#e35b32">
    <rect x="291" y="10" width="5" height="10" rx=".5"/>
    <rect x="298" y="10" width="5" height="10" rx=".5"/>
    <rect x="305" y="10" width="5" height="10" rx=".5"/>
    <rect x="291" y="44" width="5" height="10" rx=".5"/>
    <rect x="298" y="44" width="5" height="10" rx=".5"/>
    <rect x="305" y="44" width="5" height="10" rx=".5"/>
  </g>
  <path d="M304 23h10v18h-10" fill="none" stroke="#161815" stroke-width="1.5"/>
</svg>
